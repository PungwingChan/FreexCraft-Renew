name: FreeXCraft 续期
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'

permissions:
  contents: write

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/FreexCraft-Renew-Private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - name: 📂 移动脚本到工作目录
        run: cp private/freexcraft_renew.sh freexcraft_renew.sh

      - name: 🛡️ 启动 GOST 代理转发
        if: ${{ env.GOST_PROXY != '' }}
        env:
          GOST_PROXY: ${{ secrets.GOST_PROXY }}
        run: |
          VERSION=$(curl -s https://api.github.com/repos/ginuerzh/gost/releases/latest | grep '"tag_name"' | cut -d'"' -f4 | tr -d 'v')
          echo "📦 GOST 版本: $VERSION"
          wget -q "https://github.com/ginuerzh/gost/releases/download/v${VERSION}/gost_${VERSION}_linux_amd64.tar.gz"
          tar -xzf "gost_${VERSION}_linux_amd64.tar.gz"
          chmod +x gost
          nohup ./gost -L http://:8080 -F "$GOST_PROXY" > gost.log 2>&1 &
          sleep 3
          echo "✅ GOST 已启动，测试连通性..."
          curl -s -x http://127.0.0.1:8080 https://api.ipify.org | sed 's/\.[0-9]*$/.**/' && echo

      - name: 🔍 调试 chunk 内容
        env:
          GOST_PROXY: ${{ secrets.GOST_PROXY }}
        run: |
          PROXY_ARG=""
          if [ -n "$GOST_PROXY" ]; then
            PROXY_ARG="-x http://127.0.0.1:8080"
          fi
          echo "=== f8cb51f0 renewServer 前后200字符 ==="
          curl -s --compressed $PROXY_ARG \
            "https://freexcraft.com/_next/static/chunks/f8cb51f045dee3c1.js" \
            -o /tmp/f8cb.js
          python3 -c "
with open('/tmp/f8cb.js', 'rb') as f:
    content = f.read().decode('utf-8', errors='ignore')
idx = content.find('renewServer')
if idx >= 0:
    print(repr(content[idx-200:idx+50]))
"

      - name: 🔧 执行续期
        env:
          FXC_ACCOUNT: ${{ secrets.FXC_ACCOUNT }}
          GOST_PROXY: ${{ secrets.GOST_PROXY }}
          TG_BOT: ${{ secrets.TG_BOT }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_DIR: ${{ github.workspace }}/private
          SCRIPT_NAME: freexcraft_renew.sh
        run: bash freexcraft_renew.sh
